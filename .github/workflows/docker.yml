name: Docker

# Builds the image on every push; publishes ghcr.io/danshinde/fakeplc on version tags.
# The smoke job starts the container and reads holding register 0 with pymodbus,
# so a broken image fails the build. Only the publish job carries packages: write.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/danshinde/fakeplc
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          load: true
          tags: fakeplc:smoke
      - name: Start the container
        run: docker run -d --name fakeplc -p 4840:4840 -p 5020:5020 fakeplc:smoke
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install "pymodbus==3.16.*"
      - name: Read holding register 0 (expects 42.5 from examples/line1.yaml)
        run: |
          python - <<'PY'
          import time
          from pymodbus.client import ModbusTcpClient

          last = None
          for _ in range(30):
              client = ModbusTcpClient("127.0.0.1", port=5020)
              if client.connect():
                  result = client.read_holding_registers(0, count=2)
                  if not result.isError():
                      value = client.convert_from_registers(
                          result.registers, data_type=client.DATATYPE.FLOAT32, word_order="big"
                      )
                      assert value == 42.5, f"holding register 0 = {value!r}, expected 42.5"
                      print(f"smoke OK: holding register 0 = {value}")
                      client.close()
                      raise SystemExit(0)
                  last = result
              client.close()
              time.sleep(1)
          raise SystemExit(f"container never answered on Modbus TCP 5020: {last}")
          PY
      - name: Container logs
        if: always()
        run: docker logs fakeplc || true
      - name: Cleanup
        if: always()
        run: docker rm -f fakeplc || true

  publish:
    runs-on: ubuntu-latest
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/danshinde/fakeplc
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
