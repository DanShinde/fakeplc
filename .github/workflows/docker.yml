name: Docker

# Builds the image on every push; publishes ghcr.io/danshinde/fakeplc on version tags.
# The smoke job starts the container and reads holding register 0 with pymodbus,
# so a broken image fails the build.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        # secrets.GITHUB_ACTOR is not a secret: the login gets an empty username.
        # Only log in when the image is actually pushed, so PRs from forks never try.
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/danshinde/fakeplc
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          load: true
          tags: fakeplc:smoke
      - name: Start the container
        run: docker run -d --name fakeplc -p 4840:4840 -p 5020:5020 fakeplc:smoke
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pymodbus
      - name: Read holding register 0 (expects 42.5 from examples/line1.yaml)
        run: |
          python - <<'PY'
          import time
          from pymodbus.client import ModbusTcpClient

          last = None
          for _ in range(30):
              client = ModbusTcpClient("127.0.0.1", port=5020)
              if client.connect():
                  result = client.read_holding_registers(0, count=2)
                  if not result.isError():
                      value = client.convert_from_registers(
                          result.registers, data_type=client.DATATYPE.FLOAT32, word_order="big"
                      )
                      assert value == 42.5, f"holding register 0 = {value!r}, expected 42.5"
                      print(f"smoke OK: holding register 0 = {value}")
                      client.close()
                      raise SystemExit(0)
                  last = result
              client.close()
              time.sleep(1)
          raise SystemExit(f"container never answered on Modbus TCP 5020: {last}")
          PY
      - name: Container logs
        if: always()
        run: docker logs fakeplc || true
      - name: Cleanup
        if: always()
        run: docker rm -f fakeplc || true
